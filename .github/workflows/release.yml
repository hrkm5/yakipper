name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"
      - name: Check the tag matches manifest.json
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi
      - run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
